server:
  port: 8071

spring:
  application:
    name: gateway-server

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: "http://localhost:8080/realms/master/protocol/openid-connect/certs"

  cloud:
    gateway:
      # COMPATIBILITY UPDATE: All gateway properties for WebFlux now live here
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

          routes:
            - id: BOOKING-SERVICE
              uri: lb://BOOKING-SERVICE
              predicates:
                - Path=/api/bookings/**

            - id: CATEGORY-SERVICE
              uri: lb://CATEGORY-SERVICE
              predicates:
                - Path=/api/categories/**

            - id: PAYMENT-SERVICE
              uri: lb://PAYMENT-SERVICE
              predicates:
                - Path=/api/payments/**

            - id: SALOON-SERVICE
              uri: lb://SALOON-SERVICE
              predicates:
                - Path=/salon/**,/api/salons/**,/api/admin/salons/**

            - id: USER-SERVICE
              uri: lb://USER-SERVICE
              predicates:
                - Path=/auth/**,/api/admin/users/**,/api/users/**,/users/**
#              filters:
#                - TokenRelay=

            - id: SERVICE-OFFERING
              uri: lb://SERVICE-OFFERING
              predicates:
                - Path=/api/service-offering/**,/api/service-offerings/**

            - id: NOTIFICATION-SERVICE
              uri: lb://NOTIFICATION-SERVICE
              predicates:
                - Path=/api/notifications/**

            - id: REVIEW-SERVICE
              uri: lb://REVIEW-SERVICE
              predicates:
                - Path=/api/reviews/**

eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8070/eureka/
